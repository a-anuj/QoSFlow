<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">QueueFlow — SDN Topology</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#555">3 switches, 6 hosts, RYU controller, bottleneck link s1-eth3 &lt;-&gt; s2-eth3 (10 Mbps)</text>

  <!-- Controller -->
  <rect x="410" y="80" width="180" height="50" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="500" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527a0">RYU Controller</text>
  <text x="500" y="117" text-anchor="middle" font-size="11" fill="#4527a0">127.0.0.1 : 6633 (OpenFlow13)</text>

  <!-- Controller lines to switches (dashed = control plane) -->
  <line x1="480" y1="130" x2="180" y2="200" stroke="#9575cd" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="500" y1="130" x2="500" y2="200" stroke="#9575cd" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="520" y1="130" x2="820" y2="200" stroke="#9575cd" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Switch s1 -->
  <rect x="100" y="200" width="160" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="180" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">s1</text>
  <text x="180" y="240" text-anchor="middle" font-size="10" fill="#1565c0">dpid 1 · OpenFlow13</text>

  <!-- Switch s2 -->
  <rect x="420" y="200" width="160" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="500" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">s2</text>
  <text x="500" y="240" text-anchor="middle" font-size="10" fill="#1565c0">dpid 2 · OpenFlow13</text>

  <!-- Switch s3 -->
  <rect x="740" y="200" width="160" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="820" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">s3</text>
  <text x="820" y="240" text-anchor="middle" font-size="10" fill="#1565c0">dpid 3 · OpenFlow13</text>

  <!-- s1 <-> s2 bottleneck link -->
  <line x1="260" y1="227" x2="420" y2="227" stroke="#c62828" stroke-width="2.5"/>
  <text x="340" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">10 Mbps bottleneck (2ms delay)</text>
  <text x="270" y="243" text-anchor="start" font-size="10" fill="#c62828">s1-eth3</text>
  <text x="410" y="243" text-anchor="end" font-size="10" fill="#c62828">s2-eth3</text>

  <!-- s2 <-> s3 link -->
  <line x1="580" y1="227" x2="740" y2="227" stroke="#1565c0" stroke-width="1.5"/>
  <text x="590" y="243" text-anchor="start" font-size="10" fill="#1565c0">s2-eth4</text>
  <text x="730" y="243" text-anchor="end" font-size="10" fill="#1565c0">s3-eth3</text>

  <!-- Host box style helper (repeated manually) -->

  <!-- h1 -->
  <rect x="30" y="340" width="110" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="85" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">h1</text>
  <text x="85" y="378" text-anchor="middle" font-size="10" fill="#2e7d32">10.0.0.1</text>
  <text x="85" y="392" text-anchor="middle" font-size="9" fill="#2e7d32">UDP:5001 (video)</text>
  <line x1="85" y1="340" x2="130" y2="255" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="45" y="330" font-size="9" fill="#2e7d32">h1-eth0</text>
  <text x="125" y="270" font-size="9" fill="#2e7d32">s1-eth1</text>

  <!-- h2 -->
  <rect x="160" y="340" width="110" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="215" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">h2</text>
  <text x="215" y="378" text-anchor="middle" font-size="10" fill="#2e7d32">10.0.0.2</text>
  <text x="215" y="392" text-anchor="middle" font-size="9" fill="#2e7d32">TCP:5002 (bulk)</text>
  <line x1="215" y1="340" x2="200" y2="255" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="220" y="330" font-size="9" fill="#2e7d32">h2-eth0</text>
  <text x="195" y="270" font-size="9" fill="#2e7d32">s1-eth2</text>

  <!-- h3 -->
  <rect x="350" y="340" width="110" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="405" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">h3</text>
  <text x="405" y="378" text-anchor="middle" font-size="10" fill="#2e7d32">10.0.0.3</text>
  <text x="405" y="392" text-anchor="middle" font-size="9" fill="#2e7d32">receiver (both flows)</text>
  <line x1="405" y1="340" x2="450" y2="255" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="365" y="330" font-size="9" fill="#2e7d32">h3-eth0</text>
  <text x="445" y="270" font-size="9" fill="#2e7d32">s2-eth1</text>

  <!-- h4 -->
  <rect x="480" y="340" width="110" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="535" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">h4</text>
  <text x="535" y="378" text-anchor="middle" font-size="10" fill="#2e7d32">10.0.0.4</text>
  <line x1="535" y1="340" x2="520" y2="255" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="540" y="330" font-size="9" fill="#2e7d32">h4-eth0</text>
  <text x="515" y="270" font-size="9" fill="#2e7d32">s2-eth2</text>

  <!-- h5 -->
  <rect x="700" y="340" width="110" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="755" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">h5</text>
  <text x="755" y="378" text-anchor="middle" font-size="10" fill="#2e7d32">10.0.0.5</text>
  <line x1="755" y1="340" x2="800" y2="255" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="715" y="330" font-size="9" fill="#2e7d32">h5-eth0</text>
  <text x="795" y="270" font-size="9" fill="#2e7d32">s3-eth1</text>

  <!-- h6 -->
  <rect x="830" y="340" width="110" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="885" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">h6</text>
  <text x="885" y="378" text-anchor="middle" font-size="10" fill="#2e7d32">10.0.0.6</text>
  <line x1="885" y1="340" x2="840" y2="255" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="890" y="330" font-size="9" fill="#2e7d32">h6-eth0</text>
  <text x="835" y="270" font-size="9" fill="#2e7d32">s3-eth2</text>

  <!-- Legend -->
  <rect x="30" y="470" width="940" height="120" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="495" font-size="13" font-weight="bold" fill="#1a1a1a">Legend</text>

  <line x1="50" y1="515" x2="90" y2="515" stroke="#c62828" stroke-width="2.5"/>
  <text x="98" y="519" font-size="11" fill="#333">Bottleneck link — bandwidth-capped at 10 Mbps (TCLink, 2ms delay). QoS queues live on s1-eth3.</text>

  <line x1="50" y1="535" x2="90" y2="535" stroke="#1565c0" stroke-width="1.5"/>
  <text x="98" y="539" font-size="11" fill="#333">Regular switch-to-switch or host-to-switch link, uncapped.</text>

  <line x1="50" y1="555" x2="90" y2="555" stroke="#9575cd" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="98" y="559" font-size="11" fill="#333">OpenFlow control channel (RYU &lt;-&gt; each switch).</text>

  <text x="50" y="578" font-size="10.5" fill="#555">All hosts on subnet 10.0.0.0/24 · Port labels shown on both ends of every physical link, matching live 'ovs-vsctl show' output.</text>
</svg>
